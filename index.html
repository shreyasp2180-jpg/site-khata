<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Project-wise money in, money out for contractors and interior designers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Site Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first ledger — sticky header, stacked project cards, bottom tab bar, slide-up entry sheet */
:root{
  --bg:#eceff0; --surface:#ffffff; --surface-2:#f4f6f7; --line:#d5dbde; --ink:#15202b; --muted:#5e6b76;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e3eaff;
  --c-in:#2563eb; --c-out:#c2410c;
  --in:#0f7a4a; --in-soft:#dff3e8; --out:#b4361f; --out-soft:#fbe5df; --due:#9a5b00; --due-soft:#fdf0d6;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 14px rgba(21,32,43,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101417; --surface:#182026; --surface-2:#1e272e; --line:#2c3740; --ink:#e7ecef; --muted:#93a1ab;
  --accent:#7aa2ff; --accent-ink:#0b1430; --accent-soft:#1d2a4d;
  --c-in:#5b8def; --c-out:#d4692c;
  --in:#4cc78b; --in-soft:#143326; --out:#f08a72; --out-soft:#3a1d17; --due:#f0b65a; --due-soft:#3a2b10;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101417; --surface:#182026; --surface-2:#1e272e; --line:#2c3740; --ink:#e7ecef; --muted:#93a1ab;
  --accent:#7aa2ff; --accent-ink:#0b1430; --accent-soft:#1d2a4d;
  --c-in:#5b8def; --c-out:#d4692c;
  --in:#4cc78b; --in-soft:#143326; --out:#f08a72; --out-soft:#3a1d17; --due:#f0b65a; --due-soft:#3a2b10;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.setup nav.bottom{display:none}
body.setup{padding-bottom:24px}
.pill{border:0;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--in-soft);color:var(--in)}
.pill.busy{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--due-soft);color:var(--due)}
.pill.bad{background:var(--out-soft);color:var(--out)}
.pill.local{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
@media (max-width:380px){header.top .pill{display:none}}
.setup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.setup-card p{margin:0}
.sc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc-head h3{margin:0;font-family:var(--f-display);font-stretch:90%;font-size:18px;flex:1;min-width:0}
.steps summary{cursor:pointer;font-weight:600;color:var(--accent)}
.steps ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps a{color:var(--accent)}
.banner .btn{margin-left:6px;vertical-align:middle}
.ctable{width:100%;border-collapse:collapse;font-size:13.5px}
.ctable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ctable td{padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
.ctable .r{text-align:right}
.ctable .b{font-weight:700}
@media (max-width:430px){.ctable th,.ctable td{padding:8px 6px;font-size:12.5px}}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.filters .fl select,.filters .fl input{padding:8px 10px;font-size:14.5px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.legend span,.tip span{display:inline-flex;align-items:center;gap:6px}
.sw-in,.sw-out{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c-in)}
.sw-out{background:var(--c-out)}
.chart-scroll{overflow-x:auto;position:relative}
.chart svg{display:block}
.chart .b-in{fill:var(--c-in)} .chart .b-out{fill:var(--c-out)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.on{fill:var(--ink);fill-opacity:.05}
.tip{position:absolute;top:6px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:430px){header.top .pill{display:none}}
.payday{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--due-soft);color:var(--due)}
.payday div{flex:1;min-width:0;display:flex;flex-direction:column}
.payday span{font-size:13px}
.steps-ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.daynav{display:flex;align-items:center;gap:10px}
.daynav .back:disabled{opacity:.35}
.daylbl{flex:1;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:16px;position:relative}
.daylbl small{font-weight:500;font-size:12.5px;color:var(--muted)}
.daylbl input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:13px;margin-top:4px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.aname{display:flex;flex-direction:column;min-width:0}
.aname b{font-weight:600;overflow-wrap:anywhere}
.aname span{font-size:12.5px;color:var(--muted)}
.aseg{display:flex;gap:4px}
.aseg button{width:42px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-family:var(--f-display);font-size:15px;color:var(--muted)}
.aseg button.s-P[aria-pressed="true"]{background:var(--in);border-color:var(--in);color:var(--surface)}
.aseg button.s-H[aria-pressed="true"]{background:var(--due);border-color:var(--due);color:var(--surface)}
.aseg button.s-A[aria-pressed="true"]{background:var(--out);border-color:var(--out);color:var(--surface)}
.aextra{grid-column:1/-1;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.ot{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;margin-right:auto}
.ot input{width:56px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 7px;font-size:14px}
.wrow{padding:11px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.wrow:first-child{border-top:0}
.wtop{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.wamt{text-align:right;display:flex;flex-direction:column}
.wamt span{font-size:11.5px;color:var(--muted)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;padding:3px 0;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.wd i{font-style:normal;font-weight:500;font-size:10px}
.wd.s-P{background:var(--in-soft);color:var(--in)}
.wd.s-H{background:var(--due-soft);color:var(--due)}
.wd.s-A{background:var(--out-soft);color:var(--out)}
.ledger-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ltable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.ltable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ltable td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.ltable tbody tr{cursor:pointer}
.ltable tbody tr:hover{background:var(--surface-2)}
.ltable .r{text-align:right;white-space:nowrap}
.ltable .b{font-weight:700}
.ltable td.d{white-space:nowrap}
.ltable td.d span,.ltable td.det span{display:block;font-size:11.5px;color:var(--muted)}
.ltable td.det{min-width:150px}
.ltable tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line)}
@media (max-width:560px){
  .ledger-wrap{overflow:visible}
  .ltable{min-width:0;display:block}
  .ltable thead{display:none}
  .ltable tbody,.ltable tfoot{display:block}
  .ltable tr{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;column-gap:10px;row-gap:2px;padding:10px 12px;border-top:1px solid var(--line)}
  .ltable tbody tr:first-child{border-top:0}
  .ltable td{padding:0;border:0;background:none}
  .ltable td.d{grid-column:1;grid-row:1/4}
  .ltable td.det{grid-column:2;grid-row:1/4;min-width:0}
  .ltable td.r{grid-column:3}
  .ltable td.r:empty{display:none}
  .ltable td.r[data-l]::before{content:attr(data-l) " ";font-size:11px;font-weight:500;color:var(--muted)}
  .ltable td.b{font-size:12.5px}
  .ltable tfoot td{border:0}
  .ltable tfoot tr{background:var(--surface-2);border-top:2px solid var(--line)}
  .ltable tfoot td:first-child{grid-column:1/3;grid-row:1/4;align-self:center}
  .rtable tr{grid-template-columns:minmax(0,1fr) auto}
  .rtable td:first-child{grid-column:1;grid-row:1/6;align-self:start}
  .rtable td.r{grid-column:2}
  .rtable tfoot td:first-child{grid-column:1;grid-row:1/6}
}

html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.banner{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--due-soft);color:var(--due);font-size:13.5px}
main{padding-block:16px 24px;display:flex;flex-direction:column;gap:18px}
h2.sec{font-family:var(--f-display);font-stretch:85%;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Summary strip */
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:600px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{background:var(--surface);padding:12px 14px;min-width:0}
.cell .k{font-size:12px;color:var(--muted);font-weight:500}
.cell .v{font-family:var(--f-display);font-weight:700;font-size:22px;font-stretch:90%;line-height:1.15;margin-top:2px}
.cell .s{font-size:12px;color:var(--muted);margin-top:2px}
.v.in{color:var(--in)}.v.out{color:var(--out)}.v.due{color:var(--due)}

/* Project cards */
.cards{display:flex;flex-direction:column;gap:10px}
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--accent)}
.pc-top{display:flex;align-items:flex-start;gap:10px}
.pc-name{font-weight:700;font-size:16.5px;line-height:1.25;text-wrap:balance}
.pc-sub{font-size:13px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.done{background:var(--in-soft);color:var(--in);border-color:transparent}
.chip.hold{background:var(--due-soft);color:var(--due);border-color:transparent}
.chip.eg{border-style:dashed}
.pc-figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pc-figs .k{font-size:11.5px;color:var(--muted)}
.pc-figs .v{font-weight:700;font-size:15px}
.meter{margin-top:12px}
.meter .bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.meter .bar i.rcv{background:var(--in);opacity:.35}
.meter .bar i.spt{background:var(--out)}
.meter .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;gap:8px}

/* Empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:left}
.empty h3{margin:0 0 6px;font-family:var(--f-display);font-stretch:90%;font-size:20px}
.empty p{margin:0 0 14px;color:var(--muted);max-width:52ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap}

/* Project detail */
.ph{display:flex;flex-direction:column;gap:6px}
.ph h1{font-family:var(--f-display);font-stretch:88%;font-weight:800;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.ph .meta{color:var(--muted);font-size:13.5px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .k{color:var(--muted);font-size:14px}
.lrow .v{font-weight:700}
.lrow.total{background:var(--surface-2)}
.lrow.total .k{color:var(--ink);font-weight:600}
.catbars{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cb{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.cb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb .t{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.cb .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cb .a{font-weight:600;min-width:5.5rem;text-align:right}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tx{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.tx:first-child{border-top:0}
.tx:hover{background:var(--surface-2)}
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:15px}
.ico.in{background:var(--in-soft);color:var(--in)}
.ico.exp{background:var(--out-soft);color:var(--out)}
.ico.pay{background:var(--due-soft);color:var(--due)}
.tx .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{text-align:right;font-weight:700}
.tx .amt small{display:block;font-weight:500;font-size:12px}
.amt.in{color:var(--in)}
.mono{font-family:var(--f-mono);font-size:12px}
.daysep{padding:6px 14px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.daysep:first-child{border-top:0}
.duerow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.duerow:first-child{border-top:0}
.muted{color:var(--muted)}
.none{padding:18px 14px;color:var(--muted);font-size:14px}

/* Bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;height:64px}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0}
.nb svg{width:22px;height:22px}
.nb[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:54px;height:54px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(29,78,216,.35);margin-top:-18px}
.fab svg{width:26px;height:26px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(0,0,0,.2)}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sh-head h3{margin:0;font-family:var(--f-display);font-stretch:88%;font-size:20px;flex:1}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:8px;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;margin-bottom:14px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[data-k="in"][aria-pressed="true"]{color:var(--in)}
.seg button[data-k="exp"][aria-pressed="true"]{color:var(--out)}
.seg button[data-k="pay"][aria-pressed="true"]{color:var(--due)}
form.f{display:flex;flex-direction:column;gap:12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr>*{min-width:0}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 11px;font-size:15.5px;font-weight:500;width:100%;min-width:0}
.fl textarea{min-height:64px;resize:vertical}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.amt-in{font-family:var(--f-display)!important;font-weight:700!important;font-size:20px!important}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.f-actions{display:flex;gap:8px;margin-top:4px}
.f-actions .btn{flex:1;padding:12px}
.photo{display:flex;align-items:center;gap:10px}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.receipt-big{width:100%;border-radius:8px;border:1px solid var(--line)}
.confirm{background:var(--out-soft);color:var(--out);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px}
.detail dt{color:var(--muted);font-size:13.5px}
.detail dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.select-inline{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13.5px;font-weight:600}
</style>
</head>
<body>

<header class="top"><div class="wrap" id="hdr"></div></header>
<div class="wrap" id="bannerWrap"></div>
<main class="wrap" id="main" aria-live="polite">
  <div class="empty"><h3>Opening your khata…</h3><p>Your projects, client receipts, site expenses and vendor dues will appear here.</p></div>
</main>
<nav class="bottom" aria-label="Sections"><div class="wrap">
  <button class="nb" data-nav="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-7h6v7"/></svg>Projects</button>
  <button class="nb" data-nav="labour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 7v4M9 8.5 10 12M15 8.5 14 12"/><path d="M2.5 15h19v2.5h-19z"/><path d="M8 21h8"/></svg>Labour</button>
  <button class="fab" id="fab" aria-label="Add entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="nb" data-nav="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-7"/></svg>Reports</button>
  <button class="nb" data-nav="parties"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/></svg>Parties</button>
</div></nav>
<div id="layer"></div>

<script>
(() => {
const CATS = ["Cement & Sand","Steel","Bricks & Blocks","Tiles & Stone","Plywood & Laminate","Hardware & Fittings","Paint","Electrical","Plumbing","Glass & Aluminium","Furniture & Fabric","Labour","Subcontractor","Transport","Equipment hire","Petty cash","Design & Consultant","Other"];
const MODES = ["UPI","Cash","Bank transfer","Cheque"];
const TYPES = ["Civil","Interior","Civil + Interior"];
const STATUS = {active:"Active",hold:"On hold",done:"Completed"};

const S = { projects:[], txns:[], workers:[], att:[], view:"home", pid:null, tab:"all", billMonth:"all", sync:null, scriptVersion:null, needsUpdate:false };
const NEED_SCRIPT = 3; // Sheet script version that stores workers & attendance

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const inr = v => (Math.round(v) < 0 ? "−₹" : "₹") + Math.abs(Math.round(v)).toLocaleString("en-IN");
const short = v => { const a = Math.abs(v), s = v < 0 ? "−" : "";
  if (a >= 1e7) return s + "₹" + (a/1e7).toFixed(a >= 1e8 ? 1 : 2).replace(/\.?0+$/,"") + " Cr";
  if (a >= 1e5) return s + "₹" + (a/1e5).toFixed(2).replace(/\.?0+$/,"") + " L";
  return s + "₹" + Math.round(a).toLocaleString("en-IN"); };
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "";
const monthKey = d => (d||"").slice(0,7);
const monthLabel = k => new Date(k + "-01T00:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const norm = s => String(s||"").trim().toLowerCase();
const proj = id => S.projects.find(p => p.id === id);
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3600); }

/* ---------- maths ---------- */
function stats(pid){
  const tx = S.txns.filter(t => t.projectId === pid);
  let rec=0, billed=0, gst=0, paidBills=0, vpay=0; const cats={};
  for (const t of tx){
    if (t.kind==="in") rec += n(t.amount);
    else if (t.kind==="exp"){ billed += n(t.amount); gst += n(t.gst); paidBills += n(t.paid); cats[t.category||"Other"] = (cats[t.category||"Other"]||0) + n(t.amount); }
    else if (t.kind==="pay") vpay += n(t.amount);
  }
  const p = proj(pid) || {}; const contract = n(p.contract);
  const paidOut = paidBills + vpay;
  return { rec, billed, gst, paidOut, dues: billed - paidOut, clientBal: contract - rec, cash: rec - paidOut, contract, margin: contract - billed, cats, count: tx.length };
}
function duesList(pid){
  const m = new Map();
  for (const t of S.txns){
    if (pid && t.projectId !== pid) continue;
    if (t.kind!=="exp" && t.kind!=="pay") continue;
    const key = t.projectId + "|" + norm(t.party);
    if (!norm(t.party)) continue;
    const r = m.get(key) || { projectId:t.projectId, party:t.party.trim(), billed:0, paid:0, last:"" };
    if (t.kind==="exp"){ r.billed += n(t.amount); r.paid += n(t.paid); } else r.paid += n(t.amount);
    if ((t.date||"") > r.last) r.last = t.date;
    m.set(key, r);
  }
  return [...m.values()].map(r => ({...r, due: r.billed - r.paid})).filter(r => Math.abs(r.due) >= 1).sort((a,b)=>b.due-a.due);
}
/* Later "Pay vendor" payments are applied to that vendor's bills on the same project, oldest bill first. */
let ALLOC = new Map(), allocSrc = null;
function alloc(){
  if (allocSrc === S.txns) return ALLOC;
  const groups = new Map();
  for (const t of S.txns){
    if ((t.kind!=="exp" && t.kind!=="pay") || !norm(t.party)) continue;
    const k = t.projectId + "|" + norm(t.party);
    const g = groups.get(k) || {bills:[], pool:0};
    if (t.kind==="exp") g.bills.push(t); else g.pool += n(t.amount);
    groups.set(k, g);
  }
  const m = new Map();
  for (const g of groups.values()){
    g.bills.sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.created||0)-(b.created||0));
    for (const b of g.bills){ const rem = Math.max(0, n(b.amount)-n(b.paid)); const take = Math.min(rem, g.pool); g.pool -= take; m.set(b.id, take); }
  }
  ALLOC = m; allocSrc = S.txns; return m;
}
const paidLater = t => t.kind==="exp" ? (alloc().get(t.id) || 0) : 0;
const unpaidOf = t => t.kind==="exp" ? Math.max(0, n(t.amount) - n(t.paid) - paidLater(t)) : 0;
function partyNames(){ const s = new Map(); for (const t of S.txns) if (norm(t.party)) s.set(norm(t.party), t.party.trim()); return [...s.values()].sort(); }

/* ---------- storage: this phone ---------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open("site-khata", 1); r.onupgradeneeded = () => r.result.createObjectStore("photos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("photos", mode); const req = fn(t.objectStore("photos")); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx("readonly", s => s.get(k)).catch(() => null), put: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => null), del: k => tx("readwrite", s => s.delete(k)).catch(() => null) };
})();
let CFG = LS.get("sk.cfg", null);           // {mode:"sheet"|"local", url, pin}
let queue = LS.get("sk.queue", []);         // changes waiting to reach the Sheet
function persist(){ if (!LS.set("sk.data", {projects:S.projects, txns:S.txns, workers:S.workers, att:S.att})) toast("Phone storage is full. Download a backup and remove old photos."); }

/* ---------- storage: Google Sheet ---------- */
async function api(body, cfg = CFG){
  let res;
  try { res = await fetch(cfg.url, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({...body, pin: cfg.pin}) }); }
  catch { throw {code:"offline"}; }
  let j; try { j = await res.json(); } catch { throw {code:"bad_url"}; }
  if (!j.ok) throw {code:j.error || "server", message:j.message};
  return j;
}
function syncMsg(e){
  const c = e && e.code;
  if (c==="offline") return "You're offline. Changes are kept on this phone and will sync when you're back online.";
  if (c==="wrong_pin") return "The PIN doesn't match the one in your Google Sheet script. Fix it in Settings.";
  if (c==="pin_not_set") return "Set your own PIN at the top of the Google Sheet script, then deploy it again.";
  if (c==="bad_url") return "That link didn't answer like the Site Khata script. In Apps Script open Deploy → Manage deployments, check Who has access is set to Anyone, and copy the Web app URL ending in /exec.";
  return "The Google Sheet reported a problem" + (e && e.message ? ": " + e.message : ".") + " Your changes are safe on this phone.";
}
function setSync(state, err){ S.sync = {state, err, at: state==="ok" ? Date.now() : (S.sync && S.sync.at)}; if (state==="ok") LS.set("sk.lastSync", Date.now()); paintPill(); }
let flushing = false;
async function flush(){
  if (flushing || !CFG || CFG.mode!=="sheet") return;
  flushing = true;
  try {
    let i = 0, held = 0;
    while (i < queue.length){
      setSync("syncing");
      const op = queue[i], body = {...op}; delete body.photoId;
      if (op.photoId) body.photo = await idb.get(op.photoId);
      let r;
      try { r = await api(body); }
      catch(e){ if (e.code==="server" && /Unknown action/.test(e.message||"")){ held++; i++; continue; } throw e; }
      if (op.action==="saveEntry" && r.receiptId){ const t = S.txns.find(x => x.id===op.entry.id); if (t){ t.receiptId = r.receiptId; t.receiptUrl = r.receiptUrl; persist(); } }
      queue.splice(i, 1); LS.set("sk.queue", queue);
    }
    S.needsUpdate = held > 0;
    setSync("ok"); if (held) render();
  } catch(e){ setSync(e.code==="offline" ? "offline" : "error", e); }
  finally { flushing = false; }
}
async function pull(){
  if (!CFG || CFG.mode!=="sheet") return;
  await flush();
  if (queue.length && !S.needsUpdate) return;
  try {
    setSync("syncing");
    const r = await api({action:"load"});
    const heldW = queue.filter(o => o.action==="saveWorker").map(o => o.worker), heldA = queue.filter(o => o.action==="saveAtt").flatMap(o => o.items), delA = new Set(queue.filter(o => o.action==="deleteAtt").flatMap(o => o.ids));
    S.scriptVersion = r.version || 1;
    S.projects = r.projects || []; S.txns = r.txns || []; allocSrc = null;
    if (r.workers) { S.workers = r.workers; S.att = r.attendance || []; }
    // keep labour changes still waiting on this phone (e.g. while the Sheet script is out of date)
    for (const w of heldW){ const i = S.workers.findIndex(x => x.id===w.id); if (i>=0) S.workers[i] = w; else S.workers.push(w); }
    for (const a of heldA){ const i = S.att.findIndex(x => x.id===a.id); if (i>=0) S.att[i] = a; else S.att.push(a); }
    S.att = S.att.filter(a => !delA.has(a.id));
    persist(); setSync("ok"); render();
  } catch(e){ setSync(e.code==="offline" ? "offline" : "error", e); }
}
function commit(op){
  allocSrc = null; persist(); render();
  if (!CFG || CFG.mode!=="sheet") return;
  queue.push(op); LS.set("sk.queue", queue); flush();
}
const store = {
  async saveProject(p){ const i = S.projects.findIndex(x => x.id===p.id); if (i>=0) S.projects[i] = p; else S.projects.push(p); commit({action:"saveProject", project:p}); },
  async deleteProject(id){ for (const t of S.txns.filter(t => t.projectId===id)) idb.del(t.id); S.projects = S.projects.filter(p => p.id!==id); S.txns = S.txns.filter(t => t.projectId!==id); commit({action:"deleteProject", id}); },
  async saveTxn(t, photo){ if (photo){ await idb.put(t.id, photo); t.receipt = true; } const i = S.txns.findIndex(x => x.id===t.id); if (i>=0) S.txns[i] = t; else S.txns.push(t); commit({action:"saveEntry", entry:t, photoId: photo ? t.id : null}); },
  async deleteTxn(id){ S.txns = S.txns.filter(t => t.id!==id); idb.del(id); commit({action:"deleteEntry", id}); },
  async saveWorker(w){ const i = S.workers.findIndex(x => x.id===w.id); if (i>=0) S.workers[i] = w; else S.workers.push(w); commit({action:"saveWorker", worker:w}); },
  async saveAtt(items){ for (const a of items){ const i = S.att.findIndex(x => x.id===a.id); if (i>=0) S.att[i] = a; else S.att.push(a); } commit({action:"saveAtt", items}); },
  async deleteAtt(ids){ const d = new Set(ids); S.att = S.att.filter(a => !d.has(a.id)); commit({action:"deleteAtt", ids}); },
  async getReceipt(t){
    const local = await idb.get(t.id); if (local) return local;
    if (CFG && CFG.mode==="sheet" && t.receiptId){ const r = await api({action:"getReceipt", receiptId:t.receiptId}); idb.put(t.id, r.photo); return r.photo; }
    return null;
  }
};
function fail(e){ if (!(e && e.code)) console.error(e); toast(e && e.code ? syncMsg(e) : "Something went wrong. Try again."); }
async function run(fn, ok){ try { await fn(); if (ok) toast(ok); return true; } catch(e){ fail(e); return false; } }

/* ---------- sync pill ---------- */
function pillState(){
  if (!CFG) return ["", ""];
  if (CFG.mode==="local") return ["On this phone", "local"];
  const st = S.sync ? S.sync.state : "idle", w = queue.length;
  if (st==="syncing") return ["Syncing…", "busy"];
  if (st==="offline") return ["Offline" + (w ? " · " + w + " waiting" : ""), "warn"];
  if (st==="error") return ["Sync problem", "bad"];
  if (w) return [w + " waiting", "warn"];
  return ["Synced", "ok"];
}
function paintPill(){ const el = $("#pill"); if (!el) return; const [t, c] = pillState(); el.textContent = t; el.className = "pill " + c; el.hidden = !t; }

/* ---------- backup & files ---------- */
function saveFile(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function downloadBackup(){
  saveFile("site-khata-backup-" + today() + ".json", JSON.stringify({app:"site-khata", version:2, exported:new Date().toISOString(), projects:S.projects, txns:S.txns, workers:S.workers, att:S.att}, null, 1), "application/json");
  LS.set("sk.lastBackup", Date.now()); render(); toast("Backup downloaded. Keep it on Drive or WhatsApp.");
}
async function restoreBackup(file){
  let d; try { d = JSON.parse(await file.text()); } catch { toast("That file isn't a Site Khata backup."); return; }
  if (!d || d.app!=="site-khata" || !Array.isArray(d.projects) || !Array.isArray(d.txns)){ toast("That file isn't a Site Khata backup."); return; }
  await run(async () => { for (const p of d.projects) await store.saveProject(p); for (const t of d.txns) await store.saveTxn(t); for (const w of (d.workers||[])) await store.saveWorker(w); if ((d.att||[]).length) await store.saveAtt(d.att); }, "Restored " + d.projects.length + " projects and " + d.txns.length + " entries");
}


function nudge(){
  const w = $("#bannerWrap"); let h = "";
  if (CFG && CFG.mode==="local" && CFG.trial && S.view==="home") h = `<div class="banner"><b>Trial mode.</b> These are sample projects, saved on this phone only. Try adding entries, labour and PDFs. When you're ready to use it for real, tap <b>Remove examples</b> and connect your Google Sheet in Settings. <button class="btn small" data-act="settings">Settings</button></div>`;
  if (!h && CFG && CFG.mode==="local" && S.txns.length && S.view!=="settings" && S.view!=="connect" && !(CFG.trial && S.txns.every(t => t.sample))){
    const bk = LS.get("sk.lastBackup", 0);
    if (Date.now() - bk > 14*864e5) h = `<div class="banner">Your entries are only on this phone. ${bk ? "Your last backup is over 2 weeks old." : "You haven't made a backup yet."} <button class="btn small" data-act="backup">Download backup</button></div>`;
  }
  if (CFG && CFG.mode==="sheet" && (S.needsUpdate || (S.scriptVersion && S.scriptVersion < NEED_SCRIPT && (S.workers.length || S.view==="labour"))) && S.view!=="settings") h = `<div class="banner">Your Google Sheet script is out of date, so labour attendance is saved on this phone only for now. <button class="btn small" data-act="settings">Update script</button></div>`;
  if (CFG && CFG.mode==="sheet" && S.sync && S.sync.state==="error" && S.view!=="settings") h = `<div class="banner">${esc(syncMsg(S.sync.err))} <button class="btn small" data-act="settings">Open settings</button></div>`;
  if (w.innerHTML !== h) w.innerHTML = h;
}
let scriptText = null;
function loadScriptText(){ if (scriptText) return; fetch("google-sheet-script.gs").then(r => r.ok ? r.text() : null).then(t => { scriptText = t; }).catch(() => {}); }
function copyScript(btn){
  if (!scriptText){ toast("Couldn't load the script. Check your connection and try again."); loadScriptText(); return; }
  const fallback = () => { openSheet(`<div class="sh-head"><h3>Site Khata script</h3><button class="x" data-act="close" aria-label="Close">×</button></div><p class="hint">Select all of this text and copy it.</p><textarea id="scr" class="mono" readonly style="width:100%;height:50vh;font-size:11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px">${esc(scriptText)}</textarea>`); const t = $("#scr"); t.focus(); t.select(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(scriptText).then(() => { btn.textContent = "Copied ✓"; toast("Script copied"); }, fallback);
  else fallback();
}

/* ---------- setup & settings ---------- */
function cleanUrl(u){ return String(u||"").trim().replace(/\/macros\/u\/\d+\/s\//, "/macros/s/").replace(/[?#].*$/, ""); }
function renderConnect(){
  loadScriptText();
  header("Site Khata", "Set up your project ledger", !!CFG);
  const realP = S.projects.filter(p => !p.sample), realT = S.txns.filter(t => !t.sample), has = realP.length || realT.length;
  $("#main").innerHTML = `
  <div class="ph"><h1>Where should your khata be saved?</h1><p class="muted" style="margin:0;max-width:56ch">Pick once. You can change it later in Settings.</p></div>
  <section class="setup-card">
    <div class="sc-head"><h3>Save to my Google Sheet</h3><span class="chip active">Recommended</span></div>
    <p class="muted">Entries are saved in a Google Sheet in your own Google account, so they're safe if you lose your phone, and the same on phone and laptop. Your accountant can read the Sheet directly. Receipt photos go to a Drive folder. Free.</p>
    <details class="steps"><summary>One-time setup, about 15 minutes. Easiest on a laptop.</summary>
      <ol>
        <li>Open <a href="https://sheets.new" target="_blank" rel="noopener">sheets.new</a> to create a blank Google Sheet. Name it <b>Site Khata</b>.</li>
        <li>In the Sheet, open <b>Extensions → Apps Script</b>. Delete the sample code that's there.</li>
        <li><button type="button" class="btn small" data-act="copy-script">Copy the Site Khata script</button> and paste it into the editor.</li>
        <li>On the line <span class="mono">const PIN = 'CHANGE-ME';</span> put your own secret PIN between the quotes. Click <b>Save</b>.</li>

        S.txns = [...r.txns, ...localT.filter(t => !tids.has(t.id))];
        for (const p of localP) queue.push({action:"saveProject", project:p});
        for (const t of localT) queue.push({action:"saveEntry", entry:t, photoId: t.receipt && !t.receiptId ? t.id : null});
        const localW = S.workers, localA = S.att;
        for (const w of localW) queue.push({action:"saveWorker", worker:w});

        if (r.workers){ const wid = new Set(r.workers.map(w => w.id)), aid = new Set((r.attendance||[]).map(a => a.id)); S.workers = [...r.workers, ...localW.filter(w => !wid.has(w.id))]; S.att = [...(r.attendance||[]), ...localA.filter(a => !aid.has(a.id))]; }

  });

function txRow(t, showProject){
  const p = proj(t.projectId);
  const k = t.kind;
  const ico = k==="in" ? "↓" : k==="exp" ? "↑" : "₹";
  const title = k==="in" ? (t.note || "Payment received") : k==="exp" ? (t.party || t.category || "Expense") : ("Paid " + (t.party||"vendor"));
  const bits = [];
  if (k==="exp") bits.push(t.category);
  if (k!=="in" && t.note) bits.push(t.note);
  if (k==="in") bits.push(t.mode);
  if (showProject && p) bits.push(p.name);
  const due = unpaidOf(t);
  const sub = k==="exp" && due>=1 ? `<small style="color:var(--due)">${inr(due)} unpaid</small>` : k==="exp" && paidLater(t)>=1 && !t.billNo ? `<small style="color:var(--in)">Fully paid</small>` : k==="exp" && t.billNo ? `<small class="mono muted">${esc(t.billNo)}</small>` : "";
  return `<button class="tx" data-act="tx" data-id="${t.id}"><span class="ico ${k}">${ico}</span>
    <span style="min-width:0"><span class="t1" style="display:block">${esc(title)}${t.receipt?" 📎":""}</span><span class="t2" style="display:block">${esc(bits.filter(Boolean).join(" · "))}</span></span>
    <span class="amt num ${k==="in"?"in":""}">${k==="in"?"+":"−"}${inr(t.amount)}${sub}</span></button>`;
}
function txList(list, showProject){
  if (!list.length) return `<div class="list"><div class="none">Nothing here yet. Tap + to add an entry.</div></div>`;
  let h = `<div class="list">`, last = "";
  for (const t of [...list].sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.created||0)-(a.created||0))){
    const m = monthKey(t.date); if (m!==last){ h += `<div class="daysep">${monthLabel(m)}</div>`; last = m; }
    h += txRow(t, showProject);
  }
  return h + `</div>`;
}

function partyGroups(){
  const m = new Map();
  for (const t of S.txns){
    if ((t.kind!=="exp" && t.kind!=="pay") || !norm(t.party)) continue;
    const k = norm(t.party);
    const r = m.get(k) || {key:k, name:t.party.trim(), billed:0, paid:0, projects:new Set(), cats:new Set(), last:""};
    if (t.kind==="exp"){ r.billed += n(t.amount); r.paid += n(t.paid); if (t.category) r.cats.add(t.category); } else r.paid += n(t.amount);
    r.projects.add(t.projectId); if ((t.date||"") > r.last) r.last = t.date || "";
    m.set(k, r);
  }
  return [...m.values()].map(r => ({...r, bal: r.billed - r.paid}));
}

/* Ledger rows for one party: bills raise the balance, payments lower it. */
function ledgerRows(key, pid){
  const rows = [];
  for (const t of S.txns){
    if (norm(t.party)!==key || (pid && t.projectId!==pid)) continue;
    const p = proj(t.projectId), pname = p ? p.name : "";
    if (t.kind==="exp"){
      rows.push({t, date:t.date, created:t.created||0, ord:0, details:[t.category, t.billNo ? "Bill " + t.billNo : "", t.note].filter(Boolean).join(" · ") || "Bill", pname, bill:n(t.amount), paid:0});
      if (n(t.paid) >= 1) rows.push({t, date:t.date, created:t.created||0, ord:1, details:"Paid with bill" + (t.mode ? " · " + t.mode : ""), pname, bill:0, paid:n(t.paid)});
    } else if (t.kind==="pay"){
      rows.push({t, date:t.date, created:t.created||0, ord:1, details:"Payment" + (t.mode ? " · " + t.mode : "") + (t.note ? " · " + t.note : ""), pname, bill:0, paid:n(t.amount)});
    }
  }
  rows.sort((a,b) => (a.date||"").localeCompare(b.date||"") || a.created-b.created || a.ord-b.ord);
  let bal = 0; for (const r of rows){ bal += r.bill - r.paid; r.bal = bal; }
  return rows;
}
function balText(v){ return v>=1 ? inr(v) + " due" : v<=-1 ? inr(-v) + " adv" : "Nil"; }
function renderLedger(){
  const g = partyGroups().find(r => r.key===S.party);
  if (!g){ S.view="parties"; return renderParties(); }
  const pids = [...g.projects].filter(id => proj(id));
  if (S.ledgerProj && !pids.includes(S.ledgerProj)) S.ledgerProj = "";
  const rows = ledgerRows(g.key, S.ledgerProj);
  const billed = rows.reduce((x,r)=>x+r.bill,0), paid = rows.reduce((x,r)=>x+r.paid,0), bal = billed - paid;
  header("Ledger", g.name.length > 28 ? g.name.slice(0,27) + "…" : g.name, true, `<button class="btn small" data-act="party-rename">Rename</button>`);

    <div class="strip" style="grid-template-columns:repeat(3,minmax(0,1fr))">${cell("Total billed", short(billed), "out")}${cell("Total paid", short(paid), "")}${cell(bal<=-1 ? "Advance with them" : "Balance to pay", short(Math.abs(bal)), bal<=-1 ? "in" : "due")}</div>`;
  if (pids.length > 1){
    h += `<div class="tabs" role="group" aria-label="Filter by project"><button class="tab" data-act="ledger-proj" data-p="" aria-pressed="${!S.ledgerProj}">All projects</button>${pids.map(id => { const pr = proj(id), st = ledgerRows(g.key, id); const b = st.length ? st[st.length-1].bal : 0;
      return `<button class="tab" data-act="ledger-proj" data-p="${id}" aria-pressed="${S.ledgerProj===id}">${esc(pr.name.replace(/^Example – /,""))} · ${balText(b)}</button>`; }).join("")}</div>`;
  }
  h += `<div class="ledger-wrap"><table class="ltable num"><thead><tr><th>Date</th><th>Details</th><th class="r">Bill</th><th class="r">Paid</th><th class="r">Balance</th></tr></thead><tbody>`;
  h += rows.length ? rows.map(r => `<tr data-act="tx" data-id="${r.t.id}" tabindex="0"><td class="d">${esc(fmtDate(r.date).replace(/ \d{4}$/,""))}<span>${esc((r.date||"").slice(0,4))}</span></td><td class="det">${esc(r.details)}${!S.ledgerProj && pids.length>1 ? `<span>${esc(r.pname)}</span>` : ""}</td><td class="r" data-l="Bill">${r.bill ? inr(r.bill) : ""}</td><td class="r" data-l="Paid" style="color:var(--in)">${r.paid ? inr(r.paid) : ""}</td><td class="r b" data-l="Bal." style="color:${r.bal>=1?"var(--due)":r.bal<=-1?"var(--in)":"var(--muted)"}">${balText(r.bal)}</td></tr>`).join("")
    : `<tr><td colspan="5" class="none">No entries for this project.</td></tr>`;
  h += `</tbody><tfoot><tr><td colspan="2">Closing balance</td><td class="r" data-l="Billed">${inr(billed)}</td><td class="r" data-l="Paid">${inr(paid)}</td><td class="r b" data-l="Balance">${balText(bal)}</td></tr></tfoot></table></div>
    <div class="sec-row">${bal>=1 ? `<button class="btn primary" data-act="ledger-pay">Record payment</button>` : ""}<button class="btn" data-act="pdf-ledger">Export PDF</button><button class="btn" data-act="ledger-share">Copy statement</button><button class="btn" data-act="ledger-csv">CSV</button></div>
    <p class="hint">Tap any row to see or edit that entry. "Copy statement" copies a summary you can paste into WhatsApp to agree the balance with ${esc(g.name)}.</p>`;
  $("#main").innerHTML = h;
}
function ledgerStatement(){
  const g = partyGroups().find(r => r.key===S.party); const rows = ledgerRows(S.party, S.ledgerProj);
  const pr = S.ledgerProj ? proj(S.ledgerProj) : null;
  const billed = rows.reduce((x,r)=>x+r.bill,0), paid = rows.reduce((x,r)=>x+r.paid,0), bal = billed - paid;
  const lines = [`*Statement: ${g.name}*`, pr ? `Project: ${pr.name}` : "All projects", `As on ${fmtDate(today())}`, ""];
  for (const r of rows) lines.push(`${fmtDate(r.date)} – ${r.bill ? "Bill " + inr(r.bill) : "Paid " + inr(r.paid)}${r.t.billNo && r.bill ? " (" + r.t.billNo + ")" : ""}`);
  lines.push("", `Total billed: ${inr(billed)}`, `Total paid: ${inr(paid)}`, bal>=1 ? `*Balance payable: ${inr(bal)}*` : bal<=-1 ? `*Advance paid: ${inr(-bal)}*` : "*Account settled*");
  return lines.join("\n");
}
function renameParty(){
  const g = partyGroups().find(r => r.key===S.party);
  const others = partyGroups().filter(r => r.key!==g.key).map(r => `<option value="${esc(r.name)}">`).join("");

  </form>`);
  const inp = $("#r-name"), hint = $("#r-hint");
  inp.addEventListener("input", () => { const o = partyGroups().find(r => r.key===norm(inp.value) && r.key!==g.key); hint.textContent = o ? `"${o.name}" already exists. Saving merges both into one ledger (${count} entries move over).` : `Changes the name on all ${count} entries for this party.`; hint.style.color = o ? "var(--due)" : ""; });
  $("#rf").addEventListener("submit", async ev => { ev.preventDefault();
    const name = inp.value.trim(); if (!name) return;

    S.view = "ledger"; S.party = norm(finalName); render();
  });
}

/* ---------- labour: attendance & weekly wages ---------- */
const ROLES = ["Mistri","Helper","Carpenter","Painter","Plumber","Electrician","Fabricator","Tile fitter","Watchman","Other"];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const FACTOR = {P:1, H:0.5, A:0};
const payday = () => LS.get("sk.payday", 1);
const isoOf = x => new Date(x - x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays = (d, k) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + k); return isoOf(x); };
const dow = d => new Date(d + "T00:00:00").getDay();
const dShort = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", {day:"numeric", month:"short"});
const dDay = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", {weekday:"short", day:"numeric", month:"short"});
/* A wage week is 7 days starting on the payday weekday; it is paid on the next payday. */
function weekStartOf(d){ return addDays(d, -((dow(d) - payday() + 7) % 7)); }
const weekLabel = st => dShort(st) + " – " + dShort(addDays(st, 6));
const worker = id => S.workers.find(w => w.id===id);
const otRateOf = w => n(w.otRate) || Math.round(n(w.rate) / 8);
const wageFor = (w, status, ot) => Math.round(n(w.rate) * (FACTOR[status] || 0) + n(ot) * otRateOf(w));
const daysStr = v => (Math.floor(v) || (v % 1 ? "" : "0")) + (v % 1 ? "½" : "");
const payToOf = w => (w.payTo || "").trim() || w.name;

function activeProjects(){ return S.projects.filter(p => p.status !== "done"); }
function labourPid(){
  const act = activeProjects();
  if (!S.lpid || !act.some(p => p.id===S.lpid)) S.lpid = (act.find(p => p.id===S.pid) || act[0] || {}).id || null;
  return S.lpid;
}
/* Kharchi (advances) not yet deducted from wages, for one worker on one project. */
function advanceOut(wid, pid){
  let v = 0;
  for (const t of S.txns){ if (t.workerId!==wid || t.projectId!==pid) continue; if (t.kind==="pay") v += n(t.amount); else if (t.kind==="exp") v -= n(t.amount) - n(t.paid); }
  return Math.max(0, v);
}
function weekSummary(pid, st){
  const end = addDays(st, 6), m = new Map();
  for (const a of S.att){
    if (a.projectId!==pid || a.date < st || a.date > end) continue;
    const r = m.get(a.workerId) || {wid:a.workerId, name:(worker(a.workerId)||{}).name || a.worker, days:0, ot:0, gross:0, marks:{}};
    r.days += FACTOR[a.status] || 0; r.ot += n(a.ot); r.gross += n(a.wage); r.marks[a.date] = a.status; m.set(a.workerId, r);
  }
  for (const t of S.txns){ if (t.kind==="exp" && t.week===st && t.projectId===pid && t.workerId){ const r = m.get(t.workerId) || {wid:t.workerId, name:(worker(t.workerId)||{}).name || t.party, days:0, ot:0, gross:0, marks:{}}; r.paidGross = (r.paidGross||0) + n(t.amount); m.set(t.workerId, r); } }
  return [...m.values()].map(r => { r.paidGross = r.paidGross || 0; r.remaining = Math.round(r.gross - r.paidGross); r.adv = advanceOut(r.wid, pid); r.deduct = Math.max(0, Math.min(r.adv, r.remaining)); r.net = r.remaining - r.deduct; return r; })
    .sort((a,b) => a.name.localeCompare(b.name));
}
function wagesDue(st){ let v = 0, best = null, bestV = 0; for (const p of activeProjects()){ const d = weekSummary(p.id, st).reduce((x,r) => x + Math.max(0, r.remaining), 0); v += d; if (d > bestV){ bestV = d; best = p.id; } } return {total:v, pid:best}; }

function renderLabour(){
  const pid = labourPid();
  header("Labour", "Attendance & weekly wages", false, `<button class="btn small" data-act="worker-new">+ Worker</button>`);
  if (!pid){ $("#main").innerHTML = `<div class="empty"><h3>Add a project first</h3><p>Attendance is marked per site, so create a running project before adding workers.</p><div class="row"><button class="btn primary" data-act="new-project">Add a project</button></div></div>`; return; }
  S.ltab = S.ltab || "att"; S.ldate = S.ldate || today(); S.lweek = S.lweek || weekStartOf(today());
  const act = activeProjects();
  let h = `<div class="sec-row">${act.length > 1 ? `<label class="sec" for="lb-proj">Site</label><select id="lb-proj" class="select-inline">${act.map(p => `<option value="${p.id}" ${p.id===pid?"selected":""}>${esc(p.name)}</option>`).join("")}</select>` : `<h2 class="sec">${esc(proj(pid).name)}</h2>`}</div>
    <div class="tabs" role="group" aria-label="Labour section">${[["att","Attendance"],["week","Week & pay"],["workers","Workers"]].map(([k,l]) => `<button class="tab" data-act="ltab" data-k="${k}" aria-pressed="${S.ltab===k}">${l}</button>`).join("")}</div>`;
  if (S.ltab==="att") h += attendanceView(pid);
  else if (S.ltab==="week") h += weekView(pid);
  else h += workersView();
  $("#main").innerHTML = h;
}
function siteWorkers(pid, date){
  const marked = new Set(S.att.filter(a => a.projectId===pid && a.date===date).map(a => a.workerId));
  return S.workers.filter(w => (w.active!==false && w.projectId===pid) || marked.has(w.id)).sort((a,b) => a.name.localeCompare(b.name));
}
function attendanceView(pid){
  const d = S.ldate, list = siteWorkers(pid, d);
  const recs = new Map(S.att.filter(a => a.projectId===pid && a.date===d).map(a => [a.workerId, a]));
  if (!S.workers.length) return `<div class="empty"><h3>Add your workers</h3><p>Add each mistri, helper or carpenter once, with their daily rate and site. Then mark attendance here every day; on payday the app works out each person's week.</p><div class="row"><button class="btn primary" data-act="worker-new">Add a worker</button></div></div>`;
  let p=0, hf=0, ab=0, wages=0; for (const r of recs.values()){ if (r.status==="P") p++; else if (r.status==="H") hf++; else ab++; wages += n(r.wage); }
  const others = S.workers.filter(w => w.active!==false && !list.includes(w));
  let h = `<div class="daynav"><button class="back" data-act="lday" data-k="-1" aria-label="Previous day">‹</button><label class="daylbl"><span>${esc(dDay(d))}${d===today()?" · Today":""}</span><input type="date" id="lb-date" value="${d}" max="${today()}"></label><button class="back" data-act="lday" data-k="1" aria-label="Next day" ${d>=today()?"disabled":""}>›</button></div>
    <div class="strip">${cell("Present", p, "in")}${cell("Half day", hf, "due")}${cell("Absent", ab, "out")}${cell("Wages for the day", inr(wages))}</div>`;
  if (!list.length) h += `<div class="list"><div class="none">No workers assigned to this site. Add one, or pick from another site below.</div></div>`;
  else {
    const unmarked = list.filter(w => !recs.has(w.id)).length;
    h += `<div class="sec-row"><h2 class="sec">${list.length} worker${list.length>1?"s":""}</h2><div class="spacer"></div>${unmarked ? `<button class="btn small" data-act="all-present">Mark ${unmarked} present</button>` : ""}</div><div class="list">`;
    for (const w of list){
      const r = recs.get(w.id), st = r ? r.status : "";
      h += `<div class="arow"><div class="aname"><b>${esc(w.name)}</b><span>${esc(w.role||"")} · ${inr(w.rate)}/day${r && n(r.wage) ? " · " + inr(r.wage) : ""}</span></div>
        <div class="aseg" role="group" aria-label="Attendance for ${esc(w.name)}">${[["P","P","Present"],["H","½","Half day"],["A","A","Absent"]].map(([k,l,t]) => `<button data-act="mark" data-w="${w.id}" data-s="${k}" aria-pressed="${st===k}" title="${t}" class="s-${k}">${l}</button>`).join("")}</div>
        <div class="aextra"><label class="ot">OT<input inputmode="decimal" data-ot="${w.id}" value="${r && n(r.ot) ? n(r.ot) : ""}" placeholder="0" aria-label="Overtime hours for ${esc(w.name)}">h</label><button class="btn small" data-act="kharchi" data-w="${w.id}">Kharchi</button></div></div>`;
    }
    h += `</div>`;
  }
  if (others.length) h += `<label class="fl" for="lb-add">Worked here from another site<select id="lb-add"><option value="">Choose a worker…</option>${others.map(w => `<option value="${w.id}">${esc(w.name)} · ${esc((proj(w.projectId)||{}).name || "no site")}</option>`).join("")}</select></label>`;
  h += `<p class="hint">Tap P, ½ or A. Tap the same button again to clear it. Overtime hours are paid at each worker's OT rate.</p>`;
  return h;
}
function weekView(pid){
  const st = S.lweek, rows = weekSummary(pid, st), pay = addDays(st, 7);
  const days = [...Array(7)].map((_, i) => addDays(st, i));
  const due = rows.filter(r => r.remaining >= 1), tot = due.reduce((x,r) => x + r.net, 0);
  let h = `<div class="daynav"><button class="back" data-act="lweek" data-k="-7" aria-label="Previous week">‹</button><div class="daylbl"><span>${weekLabel(st)}</span><small>Payday ${WEEKDAYS[payday()]} ${dShort(pay)}</small></div><button class="back" data-act="lweek" data-k="7" aria-label="Next week" ${st>=weekStartOf(today())?"disabled":""}>›</button></div>`;
  if (!rows.length) return h + `<div class="list"><div class="none">No attendance marked on this site for this week.</div></div>`;
  const gross = rows.reduce((x,r)=>x+r.gross,0), ded = due.reduce((x,r)=>x+r.deduct,0);
  h += `<div class="strip">${cell("Wages earned", inr(gross))}${cell("Kharchi to deduct", inr(ded), "due")}${cell("To pay now", inr(tot), tot ? "out" : "")}${cell("Workers", rows.length)}</div><div class="list">`;
  for (const r of rows){
    h += `<div class="wrow"><div class="wtop"><div class="aname"><b>${esc(r.name)}</b><span>${daysStr(r.days)} day${r.days===1?"":"s"}${r.ot ? " + " + r.ot + " h OT" : ""} · earned ${inr(r.gross)}</span></div>
      <div class="wamt num">${r.remaining >= 1 ? `<b>${inr(r.net)}</b>${r.deduct ? `<span>after ${inr(r.deduct)} kharchi</span>` : r.paidGross ? `<span>extra since last payment</span>` : ""}` : r.remaining <= -1 ? `<b style="color:var(--due)">Overpaid ${inr(-r.remaining)}</b>` : `<b style="color:var(--in)">Paid ✓</b>`}</div>
      ${r.remaining >= 1 ? `<button class="btn small" data-act="pay-wages" data-w="${r.wid}">Pay</button>` : "<span></span>"}</div>
      <div class="wdays">${days.map(d => `<span class="wd s-${r.marks[d]||"x"}" title="${dDay(d)}"><i>${new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"narrow"})}</i>${r.marks[d]==="H" ? "½" : r.marks[d] || "–"}</span>`).join("")}</div></div>`;
  }
  h += `</div><div class="sec-row">${due.length > 1 ? `<button class="btn primary" data-act="pay-wages" data-w="">Pay all · ${inr(tot)}</button>` : ""}<button class="btn" data-act="pdf-wages">Wage sheet PDF</button><button class="btn" data-act="copy-wages">Copy wage sheet</button></div>
    <p class="hint">Paying records a Labour expense for each worker on this project. Kharchi given during or before the week is deducted automatically.</p>`;
  return h;
}
function workersView(){
  if (!S.workers.length) return `<div class="empty"><h3>No workers yet</h3><p>Add each person once with their daily rate. You can move them between sites any time.</p><div class="row"><button class="btn primary" data-act="worker-new">Add a worker</button></div></div>`;
  const list = [...S.workers].sort((a,b) => (a.active===false) - (b.active===false) || a.name.localeCompare(b.name));
  return `<div class="list">` + list.map(w => `<button class="tx" data-act="worker-edit" data-w="${w.id}" style="grid-template-columns:minmax(0,1fr) auto"><span style="min-width:0"><span class="t1" style="display:block">${esc(w.name)}${w.active===false ? ' <span class="chip">Inactive</span>' : ""}</span><span class="t2" style="display:block">${esc([w.role, (proj(w.projectId)||{}).name, w.payTo ? "paid via " + w.payTo : ""].filter(Boolean).join(" · "))}</span></span><span class="amt num">${inr(w.rate)}<small class="muted">per day</small></span></button>`).join("") + `</div>`;
}

function attRecord(w, pid, d, status, ot, ex){ return {id:d + "_" + w.id + "_" + pid, date:d, projectId:pid, project:(proj(pid)||{}).name || "", workerId:w.id, worker:w.name, status, ot, wage:wageFor(w, status, ot), created: ex ? ex.created : Date.now()}; }
async function markAtt(wid, status){
  const w = worker(wid), pid = labourPid(), d = S.ldate, id = d + "_" + wid + "_" + pid, ex = S.att.find(a => a.id===id);
  if (ex && ex.status===status) return run(() => store.deleteAtt([id]));
  await run(() => store.saveAtt([attRecord(w, pid, d, status, ex ? n(ex.ot) : 0, ex)]));
}
async function setOT(wid, ot){
  const w = worker(wid), pid = labourPid(), d = S.ldate, id = d + "_" + wid + "_" + pid, ex = S.att.find(a => a.id===id);
  if (!ex && !ot) return;
  await run(() => store.saveAtt([attRecord(w, pid, d, ex ? ex.status : "P", ot, ex)]));
}
async function allPresent(){
  const pid = labourPid(), d = S.ldate, have = new Set(S.att.filter(a => a.projectId===pid && a.date===d).map(a => a.workerId));
  const items = siteWorkers(pid, d).filter(w => !have.has(w.id)).map(w => attRecord(w, pid, d, "P", 0));
  if (items.length) await run(() => store.saveAtt(items), items.length + " marked present");
}

function wageSheetText(){
  const pid = labourPid(), st = S.lweek, rows = weekSummary(pid, st);
  const lines = [`*Wages: ${proj(pid).name}*`, `Week ${weekLabel(st)}`, ""];
  for (const r of rows) lines.push(`${r.name}: ${daysStr(r.days)} days${r.ot ? " + " + r.ot + "h OT" : ""} = ${inr(r.gross)}${r.deduct ? ` − kharchi ${inr(r.deduct)} = ${inr(r.net)}` : ""}${r.remaining < 1 ? " (paid)" : ""}`);
  lines.push("", `Total wages: ${inr(rows.reduce((x,r)=>x+r.gross,0))}`);
  return lines.join("\n");
}

/* ---------- reports ---------- */
const PERIODS = [["month","This month"],["lastmonth","Last month"],["fy","This financial year"],["lastfy","Last financial year"],["all","All time"],["custom","Custom dates"]];
function periodRange(){
  const R = S.rp, t = today(), y = +t.slice(0,4), m = +t.slice(5,7);
  const pad = v => String(v).padStart(2,"0"), last = (yy, mm) => isoOf(new Date(yy, mm, 0));
  const fyStart = m >= 4 ? y : y - 1;
  switch (R.period){
    case "month": return [`${y}-${pad(m)}-01`, t];
    case "lastmonth": { const ly = m===1 ? y-1 : y, lm = m===1 ? 12 : m-1; return [`${ly}-${pad(lm)}-01`, last(ly, lm)]; }
    case "fy": return [`${fyStart}-04-01`, `${fyStart+1}-03-31`];
    case "lastfy": return [`${fyStart-1}-04-01`, `${fyStart}-03-31`];
    case "custom": return [R.from || `${fyStart}-04-01`, R.to || t];
    default: { const ds = S.txns.map(x => x.date).filter(Boolean).sort(); return [ds[0] || t, t]; }
  }
}
function rangeLabel(a, b){ return S.rp.period==="all" ? "All time" : fmtDate(a) + " – " + fmtDate(b); }
function inRange(t, a, b){ return (t.date||"") >= a && (t.date||"") <= b && (!S.rp.pid || t.projectId===S.rp.pid); }
function monthsBetween(a, b){ const out = []; let y = +a.slice(0,4), m = +a.slice(5,7); const ey = +b.slice(0,4), em = +b.slice(5,7); while (y < ey || (y===ey && m <= em)){ out.push(`${y}-${String(m).padStart(2,"0")}`); m++; if (m>12){ m=1; y++; } if (out.length > 60) break; } return out; }
const outflow = t => t.kind==="exp" ? n(t.paid) : t.kind==="pay" ? n(t.amount) : 0;

function renderReports(){
  S.rp = S.rp || {period:"fy", pid:"", tab:"summary"};
  const [a, b] = periodRange();
  header("Reports", rangeLabel(a, b), false, `<button class="btn small" data-act="rp-pdf">Export PDF</button>`);
  let h = `<div class="filters">
    <label class="fl" for="rp-period">Period<select id="rp-period">${PERIODS.map(([k,l]) => `<option value="${k}" ${S.rp.period===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="fl" for="rp-proj">Project<select id="rp-proj"><option value="">All projects</option>${S.projects.map(p => `<option value="${p.id}" ${S.rp.pid===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
    ${S.rp.period==="custom" ? `<label class="fl" for="rp-from">From<input type="date" id="rp-from" value="${a}"></label><label class="fl" for="rp-to">To<input type="date" id="rp-to" value="${b}"></label>` : ""}
  </div>
  <div class="tabs" role="group" aria-label="Report">${[["summary","Summary"],["projects","Projects"],["spending","Spending"],["gst","GST & bills"],["labour","Labour"]].map(([k,l]) => `<button class="tab" data-act="rp-tab" data-k="${k}" aria-pressed="${S.rp.tab===k}">${l}</button>`).join("")}</div>`;
  const tx = S.txns.filter(t => inRange(t, a, b));
  if (S.rp.tab==="summary") h += rpSummary(tx, a, b);
  else if (S.rp.tab==="projects") h += rpProjects(tx);
  else if (S.rp.tab==="spending") h += rpSpending(tx);
  else if (S.rp.tab==="gst") h += rpGst(tx);
  else h += rpLabour(tx, a, b);
  h += `<div class="sec-row"><button class="btn small" data-act="rp-pdf">Export PDF</button><button class="btn small" data-act="rp-csv">Spreadsheet (CSV)</button></div>`;
  $("#main").innerHTML = h;
}
function rpMonthly(tx, a, b){
  const ms = monthsBetween(a, b > today() ? today() : b);
  const rows = ms.map(m => { const xs = tx.filter(t => monthKey(t.date)===m); const inn = xs.filter(t => t.kind==="in").reduce((x,t)=>x+n(t.amount),0), out = xs.reduce((x,t)=>x+outflow(t),0); return {m, inn, out, net: inn - out}; });
  while (rows.length > 1 && !rows[0].inn && !rows[0].out) rows.shift(); // start at the first month with money moving
  return rows;
}
function rpSummary(tx, a, b){
  const rec = tx.filter(t => t.kind==="in").reduce((x,t)=>x+n(t.amount),0);
  const bills = tx.filter(t => t.kind==="exp"), billed = bills.reduce((x,t)=>x+n(t.amount),0), gst = bills.reduce((x,t)=>x+n(t.gst),0);
  const paidOut = tx.reduce((x,t)=>x+outflow(t),0), labour = bills.filter(t => t.category==="Labour").reduce((x,t)=>x+n(t.amount),0);
  const rows = rpMonthly(tx, a, b);
  if (!tx.length) return `<div class="list"><div class="none">No entries in this period${S.rp.pid ? " for this project" : ""}.</div></div>`;
  return `<div class="strip">${cell("Money received", short(rec), "in")}${cell("Bills (spent)", short(billed), "out")}${cell("Paid out", short(paidOut), "")}${cell("Net cash", short(rec - paidOut), rec - paidOut < 0 ? "out" : "in", "received − paid out")}</div>
    <div class="strip">${cell("GST in bills", short(gst), "", "input tax")}${cell("Labour", short(labour), "", billed ? Math.round(labour/billed*100) + "% of bills" : "")}${cell("Entries", tx.length)}${cell("Months", rows.length)}</div>
    <h2 class="sec">Money in and out by month</h2>${chartInOut(rows)}
    <div class="ledger-wrap"><table class="ctable num"><thead><tr><th>Month</th><th class="r">In</th><th class="r">Out</th><th class="r">Net</th></tr></thead><tbody>${rows.map(r => `<tr><td>${new Date(r.m + "-01T00:00:00").toLocaleDateString("en-IN", {month:"short", year:"numeric"})}</td><td class="r" data-l="In">${inr(r.inn)}</td><td class="r" data-l="Out">${inr(r.out)}</td><td class="r b" data-l="Net" style="color:${r.net<0?"var(--out)":"var(--in)"}">${inr(r.net)}</td></tr>`).join("")}</tbody></table></div>`;
}
function niceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function chartInOut(rows){
  const W = Math.max(340, rows.length * 58 + 56), H = 210, L = 48, B = 26, T = 10, ph = H - B - T;
  const max = niceMax(Math.max(1, ...rows.map(r => Math.max(r.inn, r.out))));
  const y = v => T + ph - v / max * ph, col = (W - L - 8) / rows.length, bw = Math.min(22, (col - 14) / 2);
  const bar = (x, v, cls) => { if (v <= 0) return ""; const top = y(v), h = T + ph - top, r = Math.min(4, h); return `<path class="${cls}" d="M${x},${T+ph} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${T+ph} Z"/>`; };
  let g = "";
  for (let i = 0; i <= 4; i++){ const v = max * i / 4, yy = y(v); g += `<line x1="${L}" x2="${W-8}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-6}" y="${yy+4}" class="ax" text-anchor="end">${v ? short(v).replace("₹","") : "0"}</text>`; }
  rows.forEach((r, i) => {
    const cx = L + col * i + col / 2;

function searchHits(q){
  q = norm(q); if (!q) return {tx:[], projects:[], parties:[]};
  const num = q.replace(/[₹,\s]/g, ""), isNum = /^\d+(\.\d+)?$/.test(num);
  const tx = S.txns.filter(t => {
    if (S.sk && S.sk!=="all" && t.kind!==S.sk) return false;
    if (isNum && (String(Math.round(n(t.amount))).includes(num) || (t.billNo||"").toLowerCase().includes(q))) return true;
    const p = proj(t.projectId);
    return [t.party, t.note, t.billNo, t.category, t.mode, p && p.name, fmtDate(t.date)].some(v => norm(v).includes(q));
  });
  const projects = S.projects.filter(p => [p.name, p.client, p.site].some(v => norm(v).includes(q)));
  const parties = partyGroups().filter(r => r.key.includes(q)).slice(0, 6);
  return {tx, projects, parties};
}

let pdfLoading = null;
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("load")); document.head.appendChild(el); }); }
function toB64(buf){ let out = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) out += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(out); }
function pdfLib(){
  return pdfLoading || (pdfLoading = (async () => {
    if (!window.jspdf) await loadScript("lib/jspdf.umd.min.js");
    if (!window.jspdf.jsPDF.API.autoTable) await loadScript("lib/jspdf.plugin.autotable.min.js");
    const [reg, bold] = await Promise.all(["lib/DejaVuSans-subset.ttf", "lib/DejaVuSans-Bold-subset.ttf"].map(u => fetch(u).then(r => { if (!r.ok) throw new Error("load"); return r.arrayBuffer(); })));
    return {jsPDF: window.jspdf.jsPDF, reg: toB64(reg), bold: toB64(bold)};
  })().catch(e => { pdfLoading = null; throw e; }));
}
const firmInfo = () => LS.get("sk.firm", {}) || {};

/* Money position for a set of projects at this moment: what is owed both ways and where it nets out. */
function position(pids){
  const set = new Set(pids);
  let rec = 0, paidOut = 0, contract = 0, billed = 0;
  for (const id of pids){ const s = stats(id); rec += s.rec; paidOut += s.paidOut; contract += s.contract; billed += s.billed; }
  const dl = duesList(null).filter(r => set.has(r.projectId));
  const vendors = dl.filter(r => r.due >= 1), advances = dl.filter(r => r.due <= -1);
  const clients = pids.map(id => ({p:proj(id), bal:stats(id).clientBal})).filter(x => x.p && x.bal >= 1);
  const dues = vendors.reduce((x,r) => x + r.due, 0), adv = advances.reduce((x,r) => x - r.due, 0), toCollect = clients.reduce((x,c) => x + c.bal, 0);
  const cash = rec - paidOut;
  return {rec, paidOut, contract, billed, cash, dues, adv, toCollect, final: cash + toCollect - dues, vendors, clients};
}
function positionRows(P, opts = {}){
  const rows = [];
  if (P.contract) rows.push(["Contract value", inr(P.contract)]);
  rows.push(["Received from client" + (opts.multi ? "s" : ""), inr(P.rec)]);
  if (P.contract) rows.push(["Balance to collect from client" + (opts.multi ? "s" : ""), inr(P.toCollect)]);
  rows.push(["Total bills", inr(P.billed)], ["Paid to vendors & labour", inr(P.paidOut)], ["Dues to vendors & labour", inr(P.dues)]);
  if (P.adv) rows.push(["Advances given to vendors & labour", inr(P.adv)]);
  rows.push(["Cash in hand (received − paid)", inr(P.cash)]);
  rows.push(["Final balance (cash in hand + to collect − dues)", inr(P.final), true]);
  return rows;
}

/* What goes into each PDF */
function particulars(t){
  if (t.kind==="in") return ["Received", t.note, t.mode].filter(Boolean).join(" · ");
  if (t.kind==="exp") return [t.party || "Expense", t.category, t.note].filter(Boolean).join(" · ");
  return ["Paid " + (t.party || "vendor"), t.note, t.mode].filter(Boolean).join(" · ");
}
const byDate = (a, b) => (a.date||"").localeCompare(b.date||"") || (a.created||0) - (b.created||0);
function entriesTable(list, withProject){
  const rows = [...list].sort(byDate);
  const rec = rows.filter(t => t.kind==="in").reduce((x,t)=>x+n(t.amount),0), bills = rows.filter(t => t.kind==="exp").reduce((x,t)=>x+n(t.amount),0), paid = rows.reduce((x,t)=>x+outflow(t),0);
  const head = withProject ? ["Date", "Project", "Particulars", "Bill no.", "Received", "Bill amount", "Paid"] : ["Date", "Particulars", "Bill no.", "Received", "Bill amount", "Paid"];
  const body = rows.map(t => { const r = [fmtDate(t.date)]; if (withProject) r.push((proj(t.projectId)||{}).name || ""); r.push(particulars(t), t.billNo || "", t.kind==="in" ? inr(t.amount) : "", t.kind==="exp" ? inr(t.amount) : "", outflow(t) ? inr(outflow(t)) : ""); return r; });
  const foot = withProject ? ["Total", "", rows.length + " entries", "", inr(rec), inr(bills), inr(paid)] : ["Total", rows.length + " entries", "", inr(rec), inr(bills), inr(paid)];
  const k = withProject ? 4 : 3;
  return {head, body, foot, right:[k, k+1, k+2], cols: withProject ? {0:{cellWidth:20}, 1:{cellWidth:28}, 3:{cellWidth:18}} : {0:{cellWidth:22}, 2:{cellWidth:20}}};
}

      else { hint.textContent = "No bills from this name on this project. Check the spelling; otherwise this payment will show as an advance."; hint.style.color = "var(--out)"; }
    };
    $("#e-party").addEventListener("input", upd); $("#e-proj").addEventListener("change", upd); upd();
  }
  const full = $("#e-full");
  if (full) full.addEventListener("change", () => { $("#e-paidwrap").hidden = full.checked; });
  const ph = $("#e-photo");
  if (ph) ph.addEventListener("change", async () => { const f = ph.files[0]; if (!f) return; $("#e-photo-st").textContent = "Compressing…";
    try { pendingPhoto = await compress(f); const th=$("#e-thumb"); th.src=pendingPhoto; th.hidden=false; $("#e-photo-st").textContent = "Ready · " + Math.round(pendingPhoto.length*0.75/1024) + " KB"; }
    catch { $("#e-photo-st").textContent = "That file isn't an image we can read. Try a JPG or PNG."; } });
  $("#ef").addEventListener("submit", async ev => { ev.preventDefault();
    if (!$("#e-proj").value){ toast("Create a project first"); return; }
    const amt = n($("#e-amt").value); if (amt <= 0){ toast("Enter an amount above zero"); return; }
    const nt = {...(t||{id:uid(), created:Date.now()}), kind, projectId:$("#e-proj").value, amount:amt, date:$("#e-date").value, mode:$("#e-mode").value, note:$("#e-note").value.trim()};
    if (kind!=="in") nt.party = $("#e-party").value.trim();
    if (kind==="exp"){ nt.category=$("#e-cat").value; nt.gst=n($("#e-gst").value); nt.billNo=$("#e-bill").value.trim(); nt.paid = $("#e-full").checked ? amt : Math.min(amt, n($("#e-paid").value)); if (pendingPhoto) nt.receipt = true; }
    const photo = pendingPhoto; closeSheet();
    await run(() => store.saveTxn(nt, photo), t ? "Entry saved" : "Entry added");
  });
}
function compress(file){ return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file);
  img.onload = () => { const max = 1100, sc = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); let q=.7, d=c.toDataURL("image/jpeg",q); while (d.length > 230000 && q > .3){ q-=.1; d=c.toDataURL("image/jpeg",q); } res(d); };
  img.onerror = () => { URL.revokeObjectURL(u); rej(); }; img.src = u; }); }

async function txDetail(t){
  const p = proj(t.projectId);
  const rows = [["Project", p?p.name:"—"],["Date", fmtDate(t.date)],["Amount", inr(t.amount)]];
  if (t.kind==="exp"){ rows.push(["Category", t.category],["Party", t.party||"—"],["GST in bill", inr(n(t.gst))],["Bill no.", t.billNo||"—"],["Paid with bill", inr(n(t.paid))]); if (paidLater(t)>=1) rows.push(["Paid later", inr(paidLater(t))]); rows.push(["Unpaid", inr(unpaidOf(t))]); }
  if (t.kind==="pay") rows.push(["Paid to", t.party]);
  rows.push(["Mode", t.mode],["Note", t.note||"—"]);
  openSheet(`<div class="sh-head"><h3>${t.kind==="in"?"Money received":t.kind==="exp"?"Expense":"Vendor payment"}</h3><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="detail"><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd class="num">${esc(v)}</dd>`).join("")}</dl>${t.receipt?`<div id="rcpt" class="hint">Loading receipt…</div>`:""}</div>
    <div class="f-actions">${t.kind==="exp" && unpaidOf(t)>=1 && norm(t.party) ? `<button class="btn" data-act="pay-due" data-p="${t.projectId}" data-party="${esc(t.party)}" data-amt="${Math.round(unpaidOf(t))}">Pay balance</button>`:""}<button class="btn primary" data-act="edit-tx" data-id="${t.id}">Edit</button></div>`);
  if (t.receipt){ try { const img = await store.getReceipt(t); const el = $("#rcpt"); const link = t.receiptUrl ? `<a class="hint" href="${esc(t.receiptUrl)}" target="_blank" rel="noopener">Open in Google Drive</a>` : ""; if (el) el.outerHTML = (img ? `<img class="receipt-big" src="${img}" alt="Receipt photo">` : `<div class="hint">Receipt photo not on this phone.</div>`) + link; } catch(e) { const el=$("#rcpt"); if (el) el.textContent = e && e.code==="offline" ? "Go online to load this receipt." : "Couldn't load the receipt."; } }
}

/* ---------- export ---------- */
function exportCSV(rows, filename){
  const csv = rows.map(r => r.map(v => { const x = String(v ?? ""); return /[",\n]/.test(x) ? '"' + x.replace(/"/g,'""') + '"' : x; }).join(",")).join("\n");
  saveFile(filename, "\ufeff" + csv, "text/csv;charset=utf-8");
}
const txHead = ["Date","Project","Type","Category","Party","Amount","GST","Paid","Unpaid","Bill no.","Mode","Note"];
const txCSV = t => { const p = proj(t.projectId); return [t.date, p?p.name:"", {in:"Money in",exp:"Expense",pay:"Vendor payment"}[t.kind], t.category||"", t.party||"", n(t.amount), t.kind==="exp"?n(t.gst):"", t.kind==="exp"?n(t.paid)+paidLater(t):"", t.kind==="exp"?unpaidOf(t):"", t.billNo||"", t.mode||"", t.note||""]; };

/* ---------- events ---------- */

    case "pdf-project": exportPdf(pdfProject); break;
    case "pdf-ledger": exportPdf(pdfLedger); break;
