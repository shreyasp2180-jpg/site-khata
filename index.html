    case "pdf-wages": exportPdf(pdfWages); break;
    case "ledger": S.ledgerFrom = S.view==="ledger" ? S.ledgerFrom : S.view; S.view="ledger"; S.party=a.dataset.k; S.ledgerProj=""; window.scrollTo(0,0); render(); break;
    case "ledger-proj": S.ledgerProj=a.dataset.p; render(); break;
    case "ledger-pay": { const g = partyGroups().find(r => r.key===S.party); const pid = S.ledgerProj || (duesList(null).find(r => norm(r.party)===S.party && r.due>0) || {}).projectId; const d = duesList(pid).find(r => norm(r.party)===S.party); entryForm("pay", null, {projectId:pid, party:g.name, amount: d && d.due>0 ? Math.round(d.due) : ""}); break; }
    case "ledger-share": { const txt = ledgerStatement(); const done = () => toast("Statement copied. Paste it in WhatsApp."); const fb = () => { openSheet(`<div class="sh-head"><h3>Statement</h3><button class="x" data-act="close" aria-label="Close">×</button></div><textarea id="stm" readonly style="width:100%;height:50vh;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px;font-size:13px">${esc(txt)}</textarea>`); const t=$("#stm"); t.focus(); t.select(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fb); else fb(); break; }
    case "ledger-csv": { const g = partyGroups().find(r => r.key===S.party); exportCSV([["Date","Project","Details","Bill","Paid","Balance"], ...ledgerRows(S.party, S.ledgerProj).map(r => [r.date, r.pname, r.details, r.bill||"", r.paid||"", r.bal])], "ledger-" + g.name.replace(/[^\w\- ]+/g,"").trim() + ".csv"); break; }
    case "party-rename": renameParty(); break;
    case "go-dues": S.view="dues"; window.scrollTo(0,0); render(); break;
    case "ltab": S.ltab=a.dataset.k; render(); break;
    case "lday": { const d = addDays(S.ldate, n(a.dataset.k)); if (d <= today()){ S.ldate = d; render(); } break; }
    case "lweek": S.lweek = addDays(S.lweek, n(a.dataset.k)); render(); break;
    case "mark": markAtt(a.dataset.w, a.dataset.s); break;
    case "all-present": allPresent(); break;
    case "kharchi": kharchiForm(a.dataset.w); break;
    case "worker-new": if (!activeProjects().length){ toast("Create a project first"); break; } workerForm(); break;
    case "worker-edit": workerForm(worker(a.dataset.w)); break;
    case "pay-wages": payWagesForm(a.dataset.w); break;
    case "copy-wages": { const txt = wageSheetText(); const fb = () => { openSheet(`<div class="sh-head"><h3>Wage sheet</h3><button class="x" data-act="close" aria-label="Close">×</button></div><textarea id="stm" readonly style="width:100%;height:50vh;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px;font-size:13px">${esc(txt)}</textarea>`); const t=$("#stm"); t.focus(); t.select(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Wage sheet copied. Paste it in WhatsApp."), fb); else fb(); break; }
    case "lb-payday": { const w = wagesDue(addDays(weekStartOf(today()), -7)); S.view="labour"; S.ltab="week"; S.lweek=addDays(weekStartOf(today()), -7); if (w.pid) S.lpid = w.pid; window.scrollTo(0,0); render(); break; }
    case "settings": if (!CFG) break; S.view="settings"; window.scrollTo(0,0); render(); break;
    case "connect": S.view="connect"; render(); break;
    case "go-local": CFG = {mode:"local"}; LS.set("sk.cfg", CFG); queue = []; LS.set("sk.queue", queue); S.view="home"; render(); toast("Saving on this phone"); break;
    case "sync": pull(); break;
    case "setup-link": { const code = btoa(unescape(encodeURIComponent(JSON.stringify({url:CFG.url, pin:CFG.pin})))).replace(/\+/g,"-").replace(/\//g,"_");
      const link = location.origin + location.pathname + "#connect=" + code;
      const fb = () => { openSheet(`<div class="sh-head"><h3>Setup link</h3><button class="x" data-act="close" aria-label="Close">×</button></div><p class="hint">Copy this link and open it on the other phone.</p><textarea id="stm" readonly style="width:100%;height:120px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px;font-size:12px">${esc(link)}</textarea>`); const t=$("#stm"); t.focus(); t.select(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(() => toast("Setup link copied. Send it on WhatsApp and open it on the phone."), fb); else fb(); break; }
    case "backup": downloadBackup(); break;
    case "copy-script": copyScript(a); break;
    case "csv-all": exportCSV([txHead, ...[...S.txns].sort((x,y)=>(x.date||"").localeCompare(y.date||"")).map(txCSV)], "site-khata-all-" + today() + ".csv"); break;
    case "open": S.view="project"; S.pid=a.dataset.id; S.tab="all"; window.scrollTo(0,0); render(); break;
    case "new-project": projectForm(); break;
    case "edit-project": projectForm(proj(S.pid)); break;
    case "examples": loadExamples(); break;
    case "clear-examples": clearExamples(); break;
    case "tab": S.tab=a.dataset.k; render(); break;
    case "add": entryForm(a.dataset.k); break;
    case "kind": entryForm(a.dataset.k, null, {projectId:$("#e-proj")?.value}); break;
    case "tx": txDetail(S.txns.find(t=>t.id===a.dataset.id)); break;

    case "gst": { const amt = n($("#e-amt").value), r = n(a.dataset.r); $("#e-gst").value = amt ? (Math.round(amt*r/(100+r)*100)/100) : ""; break; }
    case "del-tx": $("#e-confirm").innerHTML = `<div class="confirm">Delete this entry? This can't be undone.<div class="f-actions"><button type="button" class="btn" data-act="cancel-del">Keep it</button><button type="button" class="btn danger" data-act="really-del-tx" data-id="${a.dataset.id}">Delete entry</button></div></div>`; break;
    case "really-del-tx": closeSheet(); run(() => store.deleteTxn(a.dataset.id), "Entry deleted"); break;
    case "del-project": { const c = S.txns.filter(t=>t.projectId===S.pid).length; $("#p-confirm").innerHTML = `<div class="confirm">Delete this project and its ${c} entr${c===1?"y":"ies"}? This can't be undone.<div class="f-actions"><button type="button" class="btn" data-act="cancel-del">Keep it</button><button type="button" class="btn danger" data-act="really-del-project">Delete project</button></div></div>`; break; }
    case "really-del-project": { const id=S.pid; closeSheet(); S.view="home"; render(); run(() => store.deleteProject(id), "Project deleted"); break; }
    case "cancel-del": a.closest(".confirm").remove(); break;
    case "csv-project": { const p = proj(S.pid); exportCSV([txHead, ...S.txns.filter(t=>t.projectId===p.id).sort((x,y)=>(x.date||"").localeCompare(y.date||"")).map(txCSV)], p.name.replace(/[^\w\- ]+/g,"").trim() + ".csv"); break; }
    case "csv-bills": exportCSV([txHead, ...S.txns.filter(t=>t.kind==="exp" && (S.billMonth==="all"||monthKey(t.date)===S.billMonth)).sort((x,y)=>(x.date||"").localeCompare(y.date||"")).map(txCSV)], "bills-" + (S.billMonth==="all"?"all":S.billMonth) + ".csv"); break;

document.addEventListener("change", ev => { if (ev.target.id==="bm"){ S.billMonth = ev.target.value; render(); }
  if (ev.target.id==="lb-proj"){ S.lpid = ev.target.value; render(); }

  if (ev.target.dataset && ev.target.dataset.ot !== undefined){ setOT(ev.target.dataset.ot, n(ev.target.value)); }

function showTip(rect){
  const box = rect.closest(".chart-scroll"), tip = box && box.querySelector(".tip"); if (!tip) return;
  const [m, i, o, net] = rect.dataset.tip.split("|");
  tip.innerHTML = `<b>${m}</b><span><i class="sw-in"></i>In ${i}</span><span><i class="sw-out"></i>Out ${o}</span><span>Net ${net}</span>`;
  tip.hidden = false; const x = +rect.dataset.x; tip.style.left = Math.max(4, Math.min(x - tip.offsetWidth/2, box.scrollWidth - tip.offsetWidth - 4)) + "px";
  box.querySelectorAll(".hit.on").forEach(r => r.classList.remove("on")); rect.classList.add("on");
}
document.addEventListener("pointerover", ev => { const r = ev.target.closest && ev.target.closest("rect.hit"); if (r) showTip(r); });
document.addEventListener("pointerout", ev => { if (ev.target.closest && ev.target.closest("svg") && !(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest(".chart-scroll"))){ const t = document.querySelector(".chart .tip"); if (t) t.hidden = true; document.querySelectorAll(".hit.on").forEach(r => r.classList.remove("on")); } });
document.addEventListener("click", ev => { const r = ev.target.closest && ev.target.closest("rect.hit"); if (r) showTip(r); });
document.addEventListener("keydown", ev => { if (ev.key==="Enter" && ev.target.matches && ev.target.matches("tr[data-act]")) ev.target.click(); if (ev.key==="Escape" && $("#layer").innerHTML) closeSheet(); });

/* ---------- boot ---------- */
function boot(){
  const c = LS.get("sk.data", null);
  if (c){ S.projects = c.projects || []; S.txns = c.txns || []; S.workers = c.workers || []; S.att = c.att || []; }
  // Links: #try opens a trial with sample projects; #connect=… fills in a Google Sheet connection.
  const hash = location.hash, cm = hash.match(/^#connect=([A-Za-z0-9+/=_-]+)$/);
  let startTrial = false;
  if (hash==="#try" && !CFG){ CFG = {mode:"local", trial:true}; LS.set("sk.cfg", CFG); startTrial = true; }
  if (cm){ try { const j = JSON.parse(decodeURIComponent(escape(atob(cm[1].replace(/-/g,"+").replace(/_/g,"/"))))); if (j.url && j.pin){ S.prefill = j; S.view = "connect"; } } catch {} }
  if (hash) history.replaceState(null, "", location.pathname);
  if (!CFG && !S.prefill) S.view = "connect";
  render();
  if (startTrial && !S.projects.length) loadExamples();
  if (CFG && CFG.mode==="sheet") pull();
  window.addEventListener("online", () => pull());
  document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible" && CFG && CFG.mode==="sheet" && Date.now() - (LS.get("sk.lastSync",0)) > 60000) pull(); });
  if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
})();
